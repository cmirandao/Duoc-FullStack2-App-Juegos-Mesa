    <link rel="icon" type="image/png" href="img/favicon.png" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos y fuentes -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Encabezado principal del sitio -->
    <header class="encabezado" id="inicio">
        <div class="contenedor encabezado-contenido">
            <h1>SEV Toys</h1>
            <p>Descubre un mundo mágico y divertido. Especialistas en Juegos de Mesa</p>
        </div>
    </header>
    <!-- Barra de navegación con logica dinámica dependiendo del usuario -->
    <nav class="navbar navbar-expand-md navbar-dark navegacion">
        <div class="container-fluid">
            <button class="navbar-toggler mx-auto mb-2" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="menuPrincipal">
                <div class="navbar-nav gap-2 gap-md-4">
                    <a class="nav-link d-inline-flex align-items-center justify-content-center gap-1"
                        href="#inicio"><span class="material-symbols-outlined">home</span>Inicio</a>
                    <a class="nav-link d-inline-flex align-items-center justify-content-center gap-1"
                        href="#indice-categorias"><span class="material-symbols-outlined">category</span>Categorías</a>

                    <!-- Elementos que se van mostrando dependiendo de la sesion y el rol -->
                    <a id="navCarrito" class="nav-link d-inline-flex align-items-center justify-content-center gap-1"
                        href="carro/carro.html"><span class="material-symbols-outlined">shopping_cart</span>Carrito</a>
                    <a id="navRegistro" class="nav-link d-inline-flex align-items-center justify-content-center gap-1"
                        href="registro/registro.html"><span
                            class="material-symbols-outlined">person_add</span>Registro</a>
                    <a id="navLogin" class="nav-link d-inline-flex align-items-center justify-content-center gap-1"
                        href="login/login.html"><span class="material-symbols-outlined">login</span>Iniciar Sesión</a>
                    <a id="navPerfil"
                        class="nav-link d-inline-flex align-items-center justify-content-center gap-1 d-none"
                        href="#"><span class="material-symbols-outlined">person</span>Mi
                        Perfil</a>
                    <a id="navCerrarSesion"
                        class="nav-link d-inline-flex align-items-center justify-content-center gap-1 d-none"
                        href="#"><span class="material-symbols-outlined">logout</span>Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <!-- Indice de categorias (estatico) -->
        <section class="seccion seccion-alterna" id="indice-categorias">
            <div class="container">
                <div class="seccion-header justify-content-center">
                    <h2>Nuestras Categorías</h2>
                </div>
                <!-- Tarjetas de categorias -->
                <div class="row g-4 mt-2">
                    <div class="col-12 col-sm-6 col-lg-3">
                        <a href="#estrategia" class="enlace-categoria">
                            <article class="tarjeta tarjeta-categoria">
                                <img src="img/cat_estrategia.png" alt="Categoría Estrategia">
                                <div class="tarjeta-contenido justify-content-center">
                                    <h3>Estrategia</h3>
                                </div>
                            </article>
                        </a>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-3">
                        <a href="#familiar" class="enlace-categoria">
                            <article class="tarjeta tarjeta-categoria">
                                <img src="img/cat_familiar.png" alt="Categoría Familiar">
                                <div class="tarjeta-contenido justify-content-center">
                                    <h3>Familiar</h3>
                                </div>
                            </article>
                        </a>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-3">
                        <a href="#cartas" class="enlace-categoria">
                            <article class="tarjeta tarjeta-categoria">
                                <img src="img/cat_cartas.png" alt="Categoría Cartas">
                                <div class="tarjeta-contenido justify-content-center">
                                    <h3>Cartas</h3>
                                </div>
                            </article>
                        </a>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-3">
                        <a href="#fiesta" class="enlace-categoria">
                            <article class="tarjeta tarjeta-categoria">
                                <img src="img/cat_fiesta.png" alt="Categoría Fiesta">
                                <div class="tarjeta-contenido justify-content-center">
                                    <h3>Fiesta</h3>
                                </div>
                            </article>
                        </a>
                    </div>
                </div>
            </div>
        </section>
        <!-- CATEGORIAS DE JUEGOS (DINÁMICO a traves de main.js) -->
        <div id="seccionesCategorias"></div>
    </main>

    <!-- FOOTER -->
    <footer class="pie-pagina text-center p-4">
        <p>© 2026 FullStack 2</p>
    </footer>

    <!-- Scripts de Bootstrap y logica propia -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/controlSesion.js"></script>

</body>

</html>
