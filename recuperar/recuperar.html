<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEV Toys | Recuperar Contraseña</title>
    <!-- Favicon SVG Transparente -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='white' stroke='%232c3e50' stroke-width='2'/%3E%3Ccircle cx='50' cy='50' r='43' fill='none' stroke='%232c3e50' stroke-width='2'/%3E%3Cg transform='translate(48, 29) rotate(18)'%3E%3Crect x='0' y='0' width='28' height='28' rx='2' fill='none' stroke='%232c3e50' stroke-width='1.5'/%3E%3Crect x='2' y='2' width='24' height='24' rx='1' fill='%232c3e50'/%3E%3Ccircle cx='7' cy='7' r='3' fill='white'/%3E%3Ccircle cx='7' cy='14' r='3' fill='white'/%3E%3Ccircle cx='7' cy='21' r='3' fill='white'/%3E%3Ccircle cx='21' cy='7' r='3' fill='white'/%3E%3Ccircle cx='21' cy='14' r='3' fill='white'/%3E%3Ccircle cx='21' cy='21' r='3' fill='white'/%3E%3C/g%3E%3Cg transform='translate(23, 35)'%3E%3Crect x='-2' y='-2' width='32' height='32' rx='3' fill='white'/%3E%3Crect x='0' y='0' width='28' height='28' rx='2' fill='none' stroke='%23e74c3c' stroke-width='1.5'/%3E%3Crect x='2' y='2' width='24' height='24' rx='1' fill='%23e74c3c'/%3E%3Ccircle cx='7' cy='7' r='3' fill='white'/%3E%3Ccircle cx='7' cy='14' r='3' fill='white'/%3E%3Ccircle cx='7' cy='21' r='3' fill='white'/%3E%3Ccircle cx='21' cy='7' r='3' fill='white'/%3E%3Ccircle cx='21' cy='14' r='3' fill='white'/%3E%3Ccircle cx='21' cy='21' r='3' fill='white'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="icon" type="image/png" href="../img/favicon.png" />
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: var(--color-fondo);">
    <!-- Contenedor principal del formulario de recuperación -->
    <div class="registro-contenedor" style="width: 100%; max-width: 450px;">
        <header class="encabezado" id="inicio">
            <div class="contenedor encabezado-contenido">
                <h1>SEV Toys</h1>
                <h2 class="fs-4">Recuperar Contraseña</h2>
                <p class="subtitulo">Ingresa tu correo electrónico y te enviaremos las instrucciones para restablecer tu acceso.</p>
            </div>
        </header>
        <!-- Formulario con validacion novalidate para manejarla con JavaScript -->
        <form class="registro-contenedor" id="formRecuperar" novalidate>
            <div class="mb-4">
                <label for="recuperarEmail" class="form-label">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><span class="material-symbols-outlined">email</span></span>
                    <input type="email" class="form-control" id="recuperarEmail" required>
                    <div class="invalid-feedback">Ingresa un correo electrónico válido.</div>
                </div>
            </div>
            <!-- Mensaje de envio exitoso -->
            <div id="mensajeRecuperacion" class="alert alert-success d-none text-center" role="alert">
                ¡Listo! Si el correo existe en nuestra base de datos, recibirás un enlace en breve.
            </div>
            <!-- Botón de envío -->
            <button type="submit" class="btn-enviar w-100 mb-4">Enviar instrucciones</button>
            <!-- Enlace de retorno -->
            <div class="text-center">
                 <a href="./../login/login.html" class="text-muted text-decoration-none transition-link hover-secundario">
                    <span class="material-symbols-outlined align-middle fs-6">arrow_back</span> Volver a Iniciar Sesión
                 </a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="recuperar.js"></script>
</body>
</html>
