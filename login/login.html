<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEV Toys | Iniciar Sesión</title>
    <!-- Favicon SVG Transparente -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='white' stroke='%232c3e50' stroke-width='2'/%3E%3Ccircle cx='50' cy='50' r='43' fill='none' stroke='%232c3e50' stroke-width='2'/%3E%3Cg transform='translate(48, 29) rotate(18)'%3E%3Crect x='0' y='0' width='28' height='28' rx='2' fill='none' stroke='%232c3e50' stroke-width='1.5'/%3E%3Crect x='2' y='2' width='24' height='24' rx='1' fill='%232c3e50'/%3E%3Ccircle cx='7' cy='7' r='3' fill='white'/%3E%3Ccircle cx='7' cy='14' r='3' fill='white'/%3E%3Ccircle cx='7' cy='21' r='3' fill='white'/%3E%3Ccircle cx='21' cy='7' r='3' fill='white'/%3E%3Ccircle cx='21' cy='14' r='3' fill='white'/%3E%3Ccircle cx='21' cy='21' r='3' fill='white'/%3E%3C/g%3E%3Cg transform='translate(23, 35)'%3E%3Crect x='-2' y='-2' width='32' height='32' rx='3' fill='white'/%3E%3Crect x='0' y='0' width='28' height='28' rx='2' fill='none' stroke='%23e74c3c' stroke-width='1.5'/%3E%3Crect x='2' y='2' width='24' height='24' rx='1' fill='%23e74c3c'/%3E%3Ccircle cx='7' cy='7' r='3' fill='white'/%3E%3Ccircle cx='7' cy='14' r='3' fill='white'/%3E%3Ccircle cx='7' cy='21' r='3' fill='white'/%3E%3Ccircle cx='21' cy='7' r='3' fill='white'/%3E%3Ccircle cx='21' cy='14' r='3' fill='white'/%3E%3Ccircle cx='21' cy='21' r='3' fill='white'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="icon" type="image/png" href="../img/favicon.png" />
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<!-- Body centrado vertical y horizontalmente -->
<body class="d-flex align-items-center justify-content-center"
    style="min-height: 100vh; background-color: var(--color-fondo);">

    <div class="registro-contenedor" style="width: 100%; max-width: 450px;">
        <header class="encabezado" id="inicio">
            <div class="contenedor encabezado-contenido">
                <h1>SEV Toys</h1>
                <h2 class="fs-4">Iniciar Sesión</h2>
            </div>
        </header>
        <!-- Formulario de inicio de sesion -->
        <form class="registro-contenedor" id="formLogin" novalidate>
            <div class="mb-3">
                <label for="loginEmail" class="form-label">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><span class="material-symbols-outlined">mail</span></span>
                    <input type="email" class="form-control" id="loginEmail" required>
                    <div class="invalid-feedback">Ingresa un correo válido.</div>
                </div>
            </div>

            <div class="mb-4">
                <label for="loginPassword" class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><span class="material-symbols-outlined">lock</span></span>
                    <input type="password" class="form-control" id="loginPassword" required>
                    <div class="invalid-feedback">La contraseña es obligatoria.</div>
                </div>
                <!-- Enlace de recuperacion -->
                <div class="text-end mt-2">
                    <a href="../recuperar/recuperar.html"
                        style="color: var(--color-principal); text-decoration: none; font-size: 0.9rem;">¿Olvidaste tu
                        contraseña?</a>
                </div>
            </div>
            <!-- Boton de envio -->
            <button type="submit" class="btn-enviar w-100 mb-3">Ingresar</button>
            <!-- Opciones de registro -->
            <div class="text-center">
                <span class="text-muted">¿No tienes una cuenta?</span>
                <a href="../registro/registro.html"
                    style="color: var(--color-secundario); font-weight: bold; text-decoration: none;">Regístrate
                    aquí</a>
            </div>
            <!-- Enlace de retorno -->
            <div class="text-center mt-3">
                <a href="../index.html" class="text-muted" style="text-decoration: none;"><span
                        class="material-symbols-outlined align-middle fs-6">arrow_back</span> Volver a la tienda</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
</body>

</html>
