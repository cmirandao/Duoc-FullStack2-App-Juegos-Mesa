<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SEV | Mi Carrito</title>
    <!-- Favicon SVG Transparente -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='white' stroke='%232c3e50' stroke-width='2'/%3E%3Ccircle cx='50' cy='50' r='43' fill='none' stroke='%232c3e50' stroke-width='2'/%3E%3Cg transform='translate(48, 29) rotate(18)'%3E%3Crect x='0' y='0' width='28' height='28' rx='2' fill='none' stroke='%232c3e50' stroke-width='1.5'/%3E%3Crect x='2' y='2' width='24' height='24' rx='1' fill='%232c3e50'/%3E%3Ccircle cx='7' cy='7' r='3' fill='white'/%3E%3Ccircle cx='7' cy='14' r='3' fill='white'/%3E%3Ccircle cx='7' cy='21' r='3' fill='white'/%3E%3Ccircle cx='21' cy='7' r='3' fill='white'/%3E%3Ccircle cx='21' cy='14' r='3' fill='white'/%3E%3Ccircle cx='21' cy='21' r='3' fill='white'/%3E%3C/g%3E%3Cg transform='translate(23, 35)'%3E%3Crect x='-2' y='-2' width='32' height='32' rx='3' fill='white'/%3E%3Crect x='0' y='0' width='28' height='28' rx='2' fill='none' stroke='%23e74c3c' stroke-width='1.5'/%3E%3Crect x='2' y='2' width='24' height='24' rx='1' fill='%23e74c3c'/%3E%3Ccircle cx='7' cy='7' r='3' fill='white'/%3E%3Ccircle cx='7' cy='14' r='3' fill='white'/%3E%3Ccircle cx='7' cy='21' r='3' fill='white'/%3E%3Ccircle cx='21' cy='7' r='3' fill='white'/%3E%3Ccircle cx='21' cy='14' r='3' fill='white'/%3E%3Ccircle cx='21' cy='21' r='3' fill='white'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="icon" type="image/png" href="img/favicon.png" />
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Encabezado de la pagina -->
    <header class="encabezado">
        <div class="contenedor encabezado-contenido">
            <h1>Carrito de Compras</h1>
        </div>
    </header>
    <!-- Barra de navegacion -->
    <nav class="navbar navbar-expand-md navbar-dark navegacion">
        <div class="container-fluid">
            <button class="navbar-toggler mx-auto mb-2" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="menuPrincipal">
                <div class="navbar-nav gap-2 gap-md-4">
                    <a class="nav-link d-inline-flex align-items-center justify-content-center gap-1"
                        href="../index.html"><span class="material-symbols-outlined">home</span>Catálogo</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Tabla de productos -->
    <main class="container py-5">
        <div class="table-responsive">
            <table class="table table-hover align-middle tabla-carrito">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio unitario</th>
                    <th>Cantidad</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="carritoBody">
                <!-- El contenido se genera dinamicamente con carro.js -->
            </tbody>
        </table>
        <!-- Resumen y boton de pago -->
        <div class="text-end">
            <h3>Total: <span id="totalCarrito">$0</span></h3>
            <button class="btn btn-primary" onclick="procesarPago()">Pagar Ahora</button>
        </div>
        </div>
    </main>

    <script src="../carro/carro.js"></script>
</body>
</html>
